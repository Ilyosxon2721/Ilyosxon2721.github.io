<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Uzum поставки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:var(--tg-theme-bg-color,#fff);--bg2:var(--tg-theme-secondary-bg-color,#f2f3f5);
    --text:var(--tg-theme-text-color,#111);--hint:var(--tg-theme-hint-color,#8a8f98);
    --accent:var(--tg-theme-button-color,#7000ff);--accent-text:var(--tg-theme-button-text-color,#fff);
    --danger:#e5484d;--ok:#16a34a;--radius:14px
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg2);color:var(--text);font:15px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding:12px 12px 96px}
  header{display:flex;align-items:center;justify-content:space-between;margin:4px 4px 12px}
  h1{font-size:19px;margin:0}
  .lang{display:flex;background:var(--bg);border-radius:10px;padding:2px}
  .lang button{border:0;background:none;color:var(--hint);padding:6px 10px;border-radius:8px;font:inherit;font-size:13px}
  .lang button.on{background:var(--bg2);color:var(--text);font-weight:600}
  .card{background:var(--bg);border-radius:var(--radius);padding:14px;margin-bottom:12px}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--hint);margin:0 0 10px;font-weight:600}
  .banner{border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;font-size:14px}
  .banner.warn{background:#fff4e5;color:#8a4b00}.banner.ok{background:#e9f9ef;color:#0b6b2f}
  label{display:block;font-size:13px;color:var(--hint);margin:12px 0 6px}
  label:first-of-type{margin-top:0}
  input[type=text],input[type=date],input[type=time]{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--bg2);border:1.5px solid transparent;border-radius:10px;padding:11px 12px;outline:none}
  input:focus{border-color:var(--accent)}
  .row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1.5px solid var(--bg2);background:var(--bg2);color:var(--text);border-radius:999px;padding:8px 12px;font:inherit;font-size:14px}
  .chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--bg));color:var(--accent);font-weight:600}
  .switch{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:15px}
  .switch input{width:44px;height:26px;appearance:none;background:var(--bg2);border-radius:999px;position:relative;transition:.2s;flex:none}
  .switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:.2s}
  .switch input:checked{background:var(--accent)}.switch input:checked::after{left:21px}
  .hint{font-size:13px;color:var(--hint);margin-top:6px}
  .err{color:var(--danger);font-size:13px;margin-top:6px;min-height:1em}
  .w{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bg2)}
  .w:first-of-type{border-top:0;padding-top:0}
  .w .info{flex:1;min-width:0}.w b{display:block}
  .w small{color:var(--hint);display:block}
  .w button{border:0;background:color-mix(in srgb,var(--danger) 12%,var(--bg));color:var(--danger);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px;flex:none}
  .empty{color:var(--hint);font-size:14px}
  #fallback{display:none;width:100%;margin-top:4px;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:600;background:var(--accent);color:var(--accent-text)}
</style>
</head>
<body>
<header>
  <h1 data-t="title"></h1>
  <div class="lang"><button data-lang="ru">RU</button><button data-lang="uz">UZ</button></div>
</header>

<div id="login" class="banner"></div>

<div class="card">
  <h2 data-t="listTitle"></h2>
  <div id="list"></div>
</div>

<div class="card">
  <h2 data-t="newTitle"></h2>
  <label for="num" data-t="numLabel"></label>
  <input id="num" type="text" inputmode="numeric" autocomplete="off" placeholder="1000368123">
  <div class="hint" data-t="numHint"></div>

  <label data-t="daysLabel"></label>
  <div class="chips" id="dayChips"></div>
  <div class="row" style="margin-top:8px">
    <input id="from" type="date" aria-label="from">
    <input id="to" type="date" aria-label="to">
  </div>

  <label data-t="timeLabel"></label>
  <div class="chips" id="timeChips"></div>
  <div class="row" id="customTime" style="margin-top:8px;display:none">
    <input id="tFrom" type="time" value="09:00" aria-label="from">
    <input id="tTo" type="time" value="14:00" aria-label="to">
  </div>

  <div class="switch"><span data-t="skipToday"></span><input id="skip" type="checkbox"></div>
  <div class="err" id="err"></div>
  <button id="fallback" data-t="submit"></button>
</div>

<script>
const TXT = {
  ru: {
    title: 'Поставки Uzum', listTitle: 'Слежу сейчас', newTitle: 'Новая поставка',
    numLabel: 'Номер поставки', numHint: 'Сначала создайте поставку в кабинете Uzum на любое время — я перенесу её на подходящее.',
    daysLabel: 'В какие дни можно привезти', timeLabel: 'В какое время удобно', skipToday: 'Не брать сегодняшнее время',
    submit: 'Начать следить', stop: 'Остановить', empty: 'Пока ни за чем не слежу.', now: 'сейчас',
    d: ['Завтра', '3 дня', 'Неделя', '2 недели'], t: ['Любое', 'Утро', 'День', 'Вечер', 'Своё'],
    loginOk: '🔑 Вход в Uzum есть', loginNone: '🔑 Нет входа в Uzum — нажмите «Вход в Uzum» в меню бота.', loginExpired: '⚠️ Вход в Uzum истёк — отправьте его заново из расширения.',
    shop: 'магазин', eNum: 'Введите номер поставки цифрами.', eDates: 'Выберите дни: «с» не позже «по».', eTime: 'Время «до» должно быть позже «с».',
  },
  uz: {
    title: 'Uzum yetkazib berish', listTitle: 'Hozir kuzatyapman', newTitle: 'Yangi yetkazib berish',
    numLabel: 'Yetkazib berish raqami', numHint: 'Avval Uzum kabinetida istalgan vaqtga yetkazib berish yarating — men uni mos vaqtga koʻchiraman.',
    daysLabel: 'Qaysi kunlari olib borish mumkin', timeLabel: 'Qaysi vaqt qulay', skipToday: 'Bugungi vaqtni olmaslik',
    submit: 'Kuzatishni boshlash', stop: 'Toʻxtatish', empty: 'Hozircha hech narsani kuzatmayapman.', now: 'hozir',
    d: ['Ertaga', '3 kun', 'Bir hafta', '2 hafta'], t: ['Istalgan', 'Ertalab', 'Kunduzi', 'Kechqurun', 'Oʻzim'],
    loginOk: '🔑 Uzumga kirish bor', loginNone: '🔑 Uzumga kirish yoʻq — bot menyusida «Uzumga kirish» ni bosing.', loginExpired: '⚠️ Uzumga kirish muddati tugagan — kengaytmadan qayta yuboring.',
    shop: 'doʻkon', eNum: 'Yetkazib berish raqamini sonlar bilan kiriting.', eDates: 'Kunlarni tanlang: boshlanishi oxiridan keyin boʻlmasin.', eTime: '«gacha» vaqti «dan» vaqtidan keyin boʻlishi kerak.',
  },
};
const DAY_PRESETS = [[1, 1], [0, 2], [0, 6], [0, 13]];
const TIME_PRESETS = [[], [[0, 720]], [[720, 1080]], [[1080, 1440]], null];

const tgApp = window.Telegram?.WebApp;
tgApp?.ready(); tgApp?.expand();

let S = { lang: 'ru', w: [], login: 'none', shop: null };
try { const m = location.hash.match(/s=([^&]+)/); if (m) S = Object.assign(S, JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(m[1].replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0))))); } catch (e) {}
let lang = S.lang || 'ru';
let dayIdx = 2, timeIdx = 0;

const $ = (id) => document.getElementById(id);
const tz = (n) => { const d = new Date(Date.now() + 5 * 3600e3 + n * 864e5); return d.toISOString().slice(0, 10); };
const toMin = (v) => { const [h, m] = v.split(':').map(Number); return h * 60 + m; };

function render() {
  const L = TXT[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = L[el.dataset.t]; });
  document.querySelectorAll('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.lang === lang));
  const lg = $('login');
  lg.className = 'banner ' + (S.login === 'ok' ? 'ok' : 'warn');
  lg.textContent = S.login === 'ok' ? `${L.loginOk}${S.shop ? ` · ${L.shop} ${S.shop}` : ''}` : (S.login === 'expired' ? L.loginExpired : L.loginNone);

  const list = $('list');
  list.innerHTML = '';
  if (!S.w.length) list.innerHTML = `<div class="empty">${L.empty}</div>`;
  S.w.forEach((w) => {
    const row = document.createElement('div');
    row.className = 'w';
    row.innerHTML = `<div class="info"><b></b><small></small><small></small></div><button></button>`;
    row.querySelector('b').textContent = '№' + w.n;
    const sm = row.querySelectorAll('small');
    sm[0].textContent = `${w.d} · ${w.t}`;
    sm[1].textContent = w.c ? `${L.now}: ${w.c}` : '';
    const btn = row.querySelector('button');
    btn.textContent = L.stop;
    btn.onclick = () => send({ action: 'stop', num: w.n });
    list.appendChild(row);
  });

  chips($('dayChips'), L.d, dayIdx, (i) => { dayIdx = i; setDays(); render(); });
  chips($('timeChips'), L.t, timeIdx, (i) => { timeIdx = i; render(); });
  $('customTime').style.display = TIME_PRESETS[timeIdx] === null ? 'flex' : 'none';
  if (tgApp?.MainButton) {
    tgApp.MainButton.setText(L.submit);
    tgApp.MainButton.show();
  } else {
    $('fallback').style.display = 'block';
  }
}

function chips(box, labels, active, onPick) {
  box.innerHTML = '';
  labels.forEach((label, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (i === active ? ' on' : '');
    b.textContent = label;
    b.onclick = () => onPick(i);
    box.appendChild(b);
  });
}

function setDays() {
  if (dayIdx < 0) return;
  const [a, b] = DAY_PRESETS[dayIdx];
  $('from').value = tz(a); $('to').value = tz(b);
}

function submit() {
  const L = TXT[lang];
  const err = $('err');
  err.textContent = '';
  const num = $('num').value.replace(/\D/g, '');
  if (num.length < 5) { err.textContent = L.eNum; return; }
  const from = $('from').value, to = $('to').value;
  if (!from || !to || to < from) { err.textContent = L.eDates; return; }
  let intervals = TIME_PRESETS[timeIdx];
  if (intervals === null) {
    const a = toMin($('tFrom').value || '00:00'), b = toMin($('tTo').value || '00:00');
    if (b <= a) { err.textContent = L.eTime; return; }
    intervals = [[a, b]];
  }
  send({ action: 'add', num, from, to, intervals, skipToday: $('skip').checked });
}

function send(data) {
  tgApp?.HapticFeedback?.impactOccurred('light');
  if (tgApp?.sendData) tgApp.sendData(JSON.stringify(data));
}

document.querySelectorAll('.lang button').forEach((b) => b.onclick = () => {
  lang = b.dataset.lang;
  render();
});
['from', 'to'].forEach((id) => $(id).addEventListener('change', () => { dayIdx = -1; render(); }));
$('num').addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, ''); });
tgApp?.MainButton?.onClick(submit);
$('fallback').onclick = submit;
$('from').min = tz(0); $('to').min = tz(0);
setDays();
render();
</script>
</body>
</html>
